#!/usr/bin/env bash
# =============================================================================
#  bot-app 全局配置（install.sh 与 botctl.sh 共用，改完执行： botctl restart all）
#  注意：本文件会被 bash source，请保持 KEY="value" 的写法。
# =============================================================================

# ------------------------------------------------------------------ 路径
# 安装根目录。留空 = 本文件所在的 bot-app 目录（所有脚本都按这个规则工作）。
# 想换盘就把【整个 bot-app 文件夹】挪过去，例如放到存储池：
#     mv bot-app /vol1/1000/ && cd /vol1/1000/bot-app
# 不要把这里改成别的绝对路径 —— venv、systemd 单元、日志都跟着脚本目录走。
BASE_DIR=""

# 服务运行用户。fnOS 的 SSH 默认是 root；想降权就改成普通用户名，
# 但要先 chown -R <用户> "$BASE_DIR" 并确认该用户能读写日志目录。
RUN_USER="root"

# ------------------------------------------------------------------ 端口
NONEBOT_PORT="8080"         # NoneBot2 监听端口（NapCat 反向 WS 连到这里）
GSCORE_PORT="8765"          # GsCore 端口（NoneBot2 连这里；Web 控制台 http://IP:8765/app）

# GsCore 的监听地址。GsCore 自己默认是 "localhost"，即只允许 NAS 本机访问，
# 局域网打不开网页控制台。0.0.0.0 表示监听所有网卡（家里内网用这个）。
# 想只限本机就改成 "127.0.0.1"。
GSCORE_HOST="0.0.0.0"

NAPCAT_WEBUI_PORT="6099"    # NapCat WebUI 端口

# ------------------------------------------------------------------ Web 后台
# 纯 Python 标准库实现的网页控制台，装完就不用再 SSH 了。
# 想只允许 NAS 本机访问就改成 "127.0.0.1"。
PANEL_HOST="0.0.0.0"
PANEL_PORT="10236"          # 后台端口（刻意避开 8888/8080 这类常用端口，减少冲突）
                            # 改端口： botctl panel port 新端口   （会自动重启面板）
                            # 密码在 panel/panel.conf 里（botctl panel password 查看）

# ------------------------------------------------------------------ 令牌
# 留空 = 安装时自动生成随机值。下面两个令牌分别管两段连接，脚本会自动写进各配置文件：
#   ONEBOT_ACCESS_TOKEN : NoneBot2 .env  <--->  NapCat 反向WS 的 token
#   GSUID_CORE_WS_TOKEN : GsCore WS_TOKEN <---> NoneBot2 .env
ONEBOT_ACCESS_TOKEN=""
GSUID_CORE_WS_TOKEN=""

# ------------------------------------------------------------------ 国内源
PYPI_INDEX="https://pypi.tuna.tsinghua.edu.cn/simple"
PYPI_INDEX_FALLBACK="https://mirrors.aliyun.com/pypi/simple/ https://mirrors.cloud.tencent.com/pypi/simple"

# GitHub 加速前缀，脚本会先并发探测哪些活着，再优先用活着的；空项代表直连
GH_PROXY_LIST="https://gh-proxy.com https://ghfast.top https://gh.llkk.cc https://ghproxy.net https://gh.zwy.one https://mirror.ghproxy.com https://hub.gitmirror.com"

# 如果你 NAS 上有 clash / v2ray 之类，填上本地代理，比任何公共加速都稳：
#     HTTP_PROXY_URL="http://127.0.0.1:7890"
HTTP_PROXY_URL=""

# 单个 git clone 的超时秒数（超时或速度过低会自动换下一个源）
GIT_TIMEOUT="300"

# Playwright 浏览器内核下载源（GsCore 渲染图片要用），国内走 npmmirror
PLAYWRIGHT_DOWNLOAD_HOST="https://cdn.npmmirror.com/binaries/playwright"

# ------------------------------------------------------------------ 源码仓库
# GsCore 官方仓库在国内镜像（cnb.cool，确认可用但仓库有 80MB+）
GSCORE_REPO_CN="https://cnb.cool/gscore-mirror/gsuid_core.git"
GSCORE_REPO="https://github.com/Genshin-bots/gsuid_core.git"
GSCORE_BRANCH="master"
# 想固定用某个源（git 地址或 tar.gz 直链），填这里；留空 = 自动按顺序尝试
GSCORE_SOURCE_OVERRIDE=""

NAPCAT_INSTALLER_RAW="https://raw.githubusercontent.com/NapNeko/NapCat-Installer/main/script/install.sh"
NAPCAT_PROXY_OPT="1"        # 传给 NapCat 安装脚本的 --proxy：0=直连，1~n=脚本内置加速节点（国内建议 1）
# 是否安装 NapCat TUI-CLI（/usr/local/bin/napcat）。
# 注意：它是【独立的交互式配置菜单】，需要终端，systemd 下跑不了，也不是启动器。
# 想看菜单就设 yes，纯无人值守建议保持 no。
NAPCAT_INSTALL_CLI="no"

# ------------------------------------------------------------------ Python
# auto = 有 uv 就用 uv（uv 能自动下载所需 Python，省得折腾系统版本），失败再退回 pip
USE_UV="auto"
PYTHON_BIN="python3"

# yes = 系统 Python 满足 GSCORE_PYTHON_MIN 时直接用它建虚拟环境，省掉解释器下载。
# no  = 一律用 uv 下载 GSCORE_PYTHON_VERSION。
PREFER_SYSTEM_PYTHON="yes"

# ⚠️ GsCore 必须 Python >= 3.12，3.11 不行！
#    它的网页控制台用 typing.TypedDict 做 FastAPI 的 response_model，
#    而 pydantic 只在 Python >= 3.12 上支持 typing.TypedDict，3.11 会抛：
#      PydanticUserError: Please use `typing_extensions.TypedDict` instead of
#                         `typing.TypedDict` on Python < 3.12.
#    后果：一个模块 import 失败 → webconsole 全部 API 路由注册失败 →
#          控制台页面能打开，但所有 /api/* 都是 404。
#    （pyproject.toml 写的是 >=3.11，但实测 3.11 跑不了控制台。）
GSCORE_PYTHON_MIN="3.12"
GSCORE_PYTHON_VERSION="3.13"

# uv 下载解释器走的是 GitHub Release，普通 PyPI 镜像不覆盖这块，必须单独指。
# 官方源在国内极慢；下面是腾讯 cnb.cool 同步镜像（实测国内带宽很足）。
UV_PYTHON_INSTALL_MIRROR="https://cnb.cool/astral-sh/python-build-standalone/-/releases/download"
# Astral 工具（ruff 之类）的索引镜像，用不到可留空
UV_ASTRAL_MIRROR_URL="https://cnrio.cn/"

# ------------------------------------------------------------------ NapCat
# 官方 Linux rootless 安装固定落在 $HOME/Napcat（root 用户即 /root/Napcat），
# 真正的可执行文件是 <目录>/opt/QQ/qq，配置在
#   <目录>/opt/QQ/resources/app/app_launcher/napcat/config/
NAPCAT_MODE="auto"          # auto | custom
NAPCAT_DIR=""               # 留空 = 自动探测；装到别处就填，例如 "/root/Napcat"
NAPCAT_CUSTOM_CMD=""        # NAPCAT_MODE=custom 时填完整启动命令
NAPCAT_USE_XVFB="yes"       # NAS 没有桌面环境，用 Xvfb 提供虚拟显示给 QQ 用

# ------------------------------------------------------------------ 其他
LOG_KEEP_DAYS="7"           # 日志保留天数
